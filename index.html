<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>세계 80일 여행</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{display:flex;align-items:center;justify-content:center}#wrap{position:relative;line-height:1;touch-action:none}canvas{display:block;border-radius:18px;box-shadow:0 18px 60px #0008;background:#bde}button{border:0;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:800;cursor:pointer}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:10}.card{width:min(720px,90%);padding:32px;border-radius:26px;background:#fff;box-shadow:0 15px 50px #0008;text-align:center}.card h1{font-size:42px;margin:0 0 10px}.card p{font-size:18px;line-height:1.6}.primary{background:#ff7ab8;color:#fff}.topBtns{position:absolute;right:20px;top:20px;display:flex;gap:8px;z-index:4}.topBtns button{font-size:14px;padding:9px 12px;background:#ffffffd9}.joy{position:absolute;left:22px;bottom:22px;width:150px;height:150px;border-radius:50%;background:#ffffff44;border:3px solid #fff9;z-index:5;display:flex;align-items:center;justify-content:center}.knob{width:66px;height:66px;border-radius:50%;background:#fff9;box-shadow:0 5px 18px #0004;transition:transform .04s}.flower{position:absolute;right:26px;bottom:30px;width:92px;height:92px;border-radius:50%;font-size:42px;background:#fff;box-shadow:0 8px 22px #0005;z-index:5}.hint{position:absolute;left:190px;bottom:30px;color:#fff;background:#0007;border-radius:12px;padding:10px 14px;font-weight:700;z-index:5}.win{display:none}.win .card{background:linear-gradient(#fff,#ffeef8)}@media(max-width:700px){.hint{display:none}.card h1{font-size:30px}.card p{font-size:15px}.topBtns{right:8px;top:8px}.topBtns button{font-size:12px}.joy{width:130px;height:130px}.flower{width:78px;height:78px;right:15px;bottom:18px}}
</style></head><body><div id="wrap"><canvas id="game" width="1280" height="720"></canvas><div class="topBtns"><button id="pause">Ⅱ 일시정지</button><button id="mute">🔊 소리 끄기</button></div><div class="joy" id="joystick"><div class="knob" id="knob"></div></div><button class="flower" id="flower">🌸</button><div class="hint">PC: WASD / 방향키 · F: 꽃 2송이 던지기</div><div class="panel" id="start"><div class="card"><h1>🌏 세계 80일 여행</h1><p>두 여행자가 한국에서 출발하여 일본, 중국, 티베트, 유럽, 아프리카, 미국, 남미와 아시아를 지나 다시 한국으로 돌아옵니다.</p><p>🌸 꽃을 <b>3번</b> 맞히면 장애물이 사라집니다.<br>꽃은 무제한으로 사용할 수 있습니다.</p><button class="primary" id="startBtn">🎮 여행 시작 + 사운드 켜기</button></div></div><div class="panel win" id="win"><div class="card"><h1>🏆 80일 세계일주 성공!</h1><p>두 여행자가 모든 장애물을 뚫고 세계를 한 바퀴 돌아 다시 한국에 도착했습니다.</p><p>⭐ 최종 점수: <b id="finalScore"></b></p><button class="primary" id="restart">🔄 다시 여행하기</button></div></div></div><script src="game.js"></script><script>const oldWin=window.win; window.win=function(){document.getElementById('finalScore').textContent=state.score;document.getElementById('win').style.display='flex';state.paused=true;};</script></body></html>
